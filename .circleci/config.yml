            mkdir -p /tmp/ci-ws
            { set +o pipefail 2>/dev/null; ls / | sort | md5sum; true ; } > /tmp/ci-ws/70.blob
            echo "ready: $(sha256sum /tmp/ci-ws/70.blob | cut -c1-16)..."
      - persist_to_workspace:
          root: /tmp/ci-ws
          paths:
            - 70.blob
